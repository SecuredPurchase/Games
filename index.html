
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue vs Red | RPS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080c15;color:white;font-family:Arial,sans-serif}
.game{height:100dvh;display:grid;grid-template-rows:1fr 1fr}
.half{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.blue{background:linear-gradient(145deg,#0755a9,#06162d);border-bottom:2px solid #fff}
.red{background:linear-gradient(145deg,#9c142c,#280713)}
.team{font-size:14px;font-weight:900;letter-spacing:4px}
.score{font-size:34px;font-weight:900}
.choices{display:flex;gap:12px}
.choice{width:clamp(70px,20vw,100px);height:clamp(70px,20vw,100px);border-radius:50%;border:2px solid #ffffff66;background:#ffffff15;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.choice.selected{border:3px solid white;background:#ffffff35}
.choice:disabled{opacity:.9}
.emoji{font-size:30px}
.label{font-size:9px;font-weight:bold;margin-top:4px}
.pick{height:25px;font-weight:bold;font-size:14px}
.center{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#080c15;border:1px solid #ffffff66;border-radius:25px;padding:9px 13px;font-size:12px;z-index:3;white-space:nowrap}
.countdown{display:none;position:fixed;inset:0;background:#050913df;align-items:center;justify-content:center;font-size:100px;font-weight:900;z-index:5}
.countdown.show{display:flex}
.status{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#080c15f5;border:1px solid #ffffff55;border-radius:18px;padding:22px 15px;width:90%;max-width:380px;text-align:center;z-index:6}
.status.show{display:block}
#result{font-size:25px;font-weight:900}
#detail{font-size:13px;color:#bac6dc;margin-top:8px}
.blueWin{color:#70baff}.redWin{color:#ff8094}.draw{color:#ffe28b}
.actions{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:7}
.action{background:#101a2b;color:white;border:1px solid #ffffff55;border-radius:22px;padding:10px 13px;font-weight:bold;white-space:nowrap}
.action:disabled{opacity:.35}
.gear{position:fixed;right:10px;bottom:10px;z-index:10;width:35px;height:35px;border-radius:50%;background:#101a2b;color:white;border:1px solid #ffffff55}
.settings{display:none;position:fixed;right:10px;bottom:53px;z-index:9;background:#111a2b;border:1px solid #ffffff44;border-radius:16px;padding:16px;width:min(285px,calc(100vw - 20px))}
.settings.open{display:block}
.settings h3{margin:0 0 8px}
.settings p{font-size:12px;color:#aebbd0}
.setting{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #ffffff22;font-size:14px}
input[type=checkbox]{width:19px;height:19px;accent-color:#2588ff}
</style>
</head>
<body>
<main class="game">
 <section class="half blue">
  <div class="team">BLUE</div>
  <div class="score" id="blueScore">0</div>
  <div class="choices">
   <button class="choice" data-side="blue" data-move="rock"><span class="emoji">✊</span><span class="label">ROCK</span></button>
   <button class="choice" data-side="blue" data-move="paper"><span class="emoji">✋</span><span class="label">PAPER</span></button>
   <button class="choice" data-side="blue" data-move="scissors"><span class="emoji">✌️</span><span class="label">SCISSORS</span></button>
  </div>
  <div class="pick" id="bluePick">Choose your move</div>
 </section>
 <section class="half red">
  <div class="team">RED</div>
  <div class="score" id="redScore">0</div>
  <div class="choices">
   <button class="choice" data-side="red" data-move="rock"><span class="emoji">✊</span><span class="label">ROCK</span></button>
   <button class="choice" data-side="red" data-move="paper"><span class="emoji">✋</span><span class="label">PAPER</span></button>
   <button class="choice" data-side="red" data-move="scissors"><span class="emoji">✌️</span><span class="label">SCISSORS</span></button>
  </div>
  <div class="pick" id="redPick">Choose your move</div>
 </section>
</main>

<div class="center" id="round">ROUND 1 / 3 · VS</div>
<div class="countdown" id="count">3</div>
<div class="status" id="status">
 <div id="result"></div>
 <div id="detail"></div>
</div>
<div class="actions">
 <button class="action" id="next" disabled>Next round →</button>
 <button class="action" id="reset">Reset</button>
</div>

<button class="gear" id="gear" aria-label="Settings">⚙</button>
<aside class="settings" id="settings">
 <h3>Secret settings ⚙</h3>
 <p>Choose the side that should always win.</p>
 <div class="setting"><label for="blueRig">Blue always wins</label><input type="checkbox" id="blueRig"></div>
 <div class="setting"><label for="redRig">Red always wins</label><input type="checkbox" id="redRig"></div>
 <div class="setting"><label for="fair">Fair mode</label><input type="checkbox" id="fair" checked></div>
</aside>

<script>
const beats={rock:"scissors",paper:"rock",scissors:"paper"};
const emojis={rock:"✊",paper:"✋",scissors:"✌️"};
const names={rock:"Rock",paper:"Paper",scissors:"Scissors"};

let round=1,blueScore=0,redScore=0;
let picks={blue:null,red:null};
let locked=false,finished=false,gameOver=false;
let timers=[];

const $=id=>document.getElementById(id);

function later(fn,ms){
 timers.push(setTimeout(fn,ms));
}

function showPick(side,move){
 $(side+"Pick").textContent=emojis[move]+" "+names[move];
}

function update(){
 $("blueScore").textContent=blueScore;
 $("redScore").textContent=redScore;
 $("round").textContent=gameOver?"MATCH COMPLETE":"ROUND "+round+" / 3 · VS";
}

function announce(title,detail,color){
 $("result").textContent=title;
 $("result").className=color;
 $("detail").textContent=detail;
 $("status").classList.add("show");
}

function clearAnnouncement(){
 $("status").classList.remove("show");
}

function resetPicks(){
 picks={blue:null,red:null};
 locked=false;
 finished=false;
 $("count").classList.remove("show");
 $("next").disabled=true;
 clearAnnouncement();

 document.querySelectorAll(".choice").forEach(button=>{
  button.disabled=false;
  button.classList.remove("selected");
 });

 $("bluePick").textContent="Choose your move";
 $("redPick").textContent="Choose your move";
}

function riggedWinner(){
 if(!$("fair").checked && $("blueRig").checked)return "blue";
 if(!$("fair").checked && $("redRig").checked)return "red";
 return null;
}

function finishRound(){
 let winner;
 const rig=riggedWinner();

 // Keep the opponent's choice unchanged.
 // Only secretly change the selected winner's displayed move if needed.
 if(rig==="blue"){
  if(beats[picks.blue]!==picks.red){
   picks.blue=Object.keys(beats).find(m=>beats[m]===picks.red);
  }
  winner="blue";
 }else if(rig==="red"){
  if(beats[picks.red]!==picks.blue){
   picks.red=Object.keys(beats).find(m=>beats[m]===picks.blue);
  }
  winner="red";
 }else if(picks.blue===picks.red){
  winner="draw";
 }else{
  winner=beats[picks.blue]===picks.red?"blue":"red";
 }

 // Update only the move display that was secretly changed.
 showPick("blue",picks.blue);
 showPick("red",picks.red);

 document.querySelectorAll(".choice").forEach(button=>{
  button.disabled=true;
  button.classList.toggle(
   "selected",
   button.dataset.move===picks[button.dataset.side]
  );
 });

 if(winner==="blue"){
  blueScore++;
  announce("BLUE WON!","Blue wins this round.","blueWin");
 }else if(winner==="red"){
  redScore++;
  announce("RED WON!","Red wins this round.","redWin");
 }else{
  announce("DRAW!","Same move — no points.","draw");
 }

 finished=true;
 locked=false;
 update();

 if(round>=3 || blueScore>=2 || redScore>=2){
  gameOver=true;
  update();

  if(blueScore>redScore){
   announce("BLUE WON THE MATCH!","Final score: "+blueScore+" - "+redScore,"blueWin");
  }else if(redScore>blueScore){
   announce("RED WON THE MATCH!","Final score: "+blueScore+" - "+redScore,"redWin");
  }else{
   announce("MATCH DRAW!","Final score: "+blueScore+" - "+redScore,"draw");
  }
  $("next").textContent="Play again ↻";
 }else{
  $("next").textContent="Next round →";
 }

 $("next").disabled=false;
}

function startCountdown(){
 if(locked || !picks.blue || !picks.red)return;

 locked=true;
 document.querySelectorAll(".choice").forEach(b=>b.disabled=true);
 clearAnnouncement();

 const count=$("count");
 count.classList.add("show");

 [3,2,1].forEach((n,i)=>{
  later(()=>count.textContent=n,i*650);
 });

 later(()=>count.textContent="GO!",1950);
 later(()=>{
  count.classList.remove("show");
  finishRound();
 },2450);
}

document.querySelectorAll(".choice").forEach(button=>{
 button.addEventListener("click",()=>{
  if(locked || finished || gameOver)return;

  const side=button.dataset.side;
  picks[side]=button.dataset.move;
  showPick(side,picks[side]);

  document.querySelectorAll('.choice[data-side="'+side+'"]')
   .forEach(b=>b.classList.toggle("selected",b===button));

  if(picks.blue && picks.red)startCountdown();
 });
});

$("next").addEventListener("click",()=>{
 if(gameOver){
  resetGame();
 }else if(finished){
  round++;
  resetPicks();
  update();
 }
});

function resetGame(){
 timers.forEach(clearTimeout);
 timers=[];
 round=1;
 blueScore=0;
 redScore=0;
 gameOver=false;
 $("next").textContent="Next round →";
 resetPicks();
 update();
}

$("reset").addEventListener("click",resetGame);
$("gear").addEventListener("click",()=>{
 $("settings").classList.toggle("open");
});

$("blueRig").addEventListener("change",()=>{
 if($("blueRig").checked){
  $("redRig").checked=false;
  $("fair").checked=false;
 }else if(!$("redRig").checked){
  $("fair").checked=true;
 }
});

$("redRig").addEventListener("change",()=>{
 if($("redRig").checked){
  $("blueRig").checked=false;
  $("fair").checked=false;
 }else if(!$("blueRig").checked){
  $("fair").checked=true;
 }
});

$("fair").addEventListener("change",()=>{
 if($("fair").checked){
  $("blueRig").checked=false;
  $("redRig").checked=false;
 }
});

update();
</script>
</body>
</html>
