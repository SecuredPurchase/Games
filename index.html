
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Paper Scissors</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #000;
  color: white;
}

.game {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100dvh;
}

.side {
  position: relative;
  width: 100%;
  height: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 20px 10px;
}

.blue-side { background: #0879ee; }
.red-side { background: #ed2029; }

.player-name {
  font-size: clamp(23px, 6vw, 34px);
  font-weight: 900;
  letter-spacing: 3px;
}

.score {
  font-size: 15px;
  font-weight: bold;
}

.round-label {
  position: absolute;
  top: 13px;
  left: 13px;
  font-size: 12px;
  font-weight: bold;
  opacity: .85;
}

.choices {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(10px, 4vw, 24px);
  margin-top: 5px;
}

.move-btn {
  width: clamp(68px, 20vw, 94px);
  height: clamp(68px, 20vw, 94px);
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,.9);
  background: rgba(255,255,255,.18);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(29px, 8vw, 42px);
  cursor: pointer;
  user-select: none;
  transition: transform .12s;
}

.move-btn:active { transform: scale(.93); }

.move-btn.selected {
  background: white;
  border-color: white;
}

.blue-side .move-btn.selected { color: #0879ee; }
.red-side .move-btn.selected { color: #ed2029; }

.move-btn.hidden-pick,
.move-btn.hidden-pick.selected {
  background: #050505 !important;
  color: transparent !important;
  border-color: #050505 !important;
  box-shadow: none !important;
}

.move-btn.hidden-pick span { visibility: hidden; }

.move-btn:disabled { cursor: default; }

.status {
  min-height: 22px;
  font-size: 14px;
  font-weight: bold;
  text-align: center;
}

.middle-line {
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 2px;
  background: rgba(255,255,255,.45);
  z-index: 2;
}

.gear {
  position: absolute;
  top: 10px;
  right: 12px;
  width: 34px;
  height: 34px;
  border: none;
  border-radius: 50%;
  background: rgba(0,0,0,.18);
  color: white;
  font-size: 20px;
  cursor: pointer;
  z-index: 4;
}

.bottom-controls {
  position: absolute;
  bottom: 10px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
}

.small-btn {
  padding: 9px 14px;
  border: 1px solid rgba(255,255,255,.65);
  border-radius: 20px;
  background: rgba(0,0,0,.18);
  color: white;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
}

.countdown {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 8;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  background: rgba(0,0,0,.12);
}

.countdown.show { display: flex; }

.count-number {
  font-size: clamp(70px, 24vw, 150px);
  font-weight: 1000;
  text-shadow: 0 5px 24px rgba(0,0,0,.4);
}

.result-banner {
  display: none;
  position: fixed;
  z-index: 7;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: max-content;
  max-width: 90%;
  padding: 13px 20px;
  border: 2px solid rgba(255,255,255,.8);
  border-radius: 14px;
  background: #111;
  color: white;
  font-size: clamp(17px, 4.5vw, 24px);
  font-weight: 900;
  text-align: center;
  box-shadow: 0 8px 25px rgba(0,0,0,.3);
}

.result-banner.show { display: block; }

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background: rgba(0,0,0,.78);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.overlay.open { display: flex; }

.panel {
  width: min(340px, 100%);
  padding: 23px;
  border-radius: 18px;
  background: #171717;
  color: white;
  box-shadow: 0 10px 40px rgba(0,0,0,.45);
}

.panel h2 {
  margin: 0 0 14px;
  font-size: 22px;
}

.panel p {
  color: #ccc;
  font-size: 14px;
  line-height: 1.4;
}

.panel label {
  display: block;
  margin: 14px 0;
  font-size: 15px;
}

.panel select {
  width: 100%;
  padding: 12px;
  margin-top: 7px;
  border: 1px solid #555;
  border-radius: 9px;
  background: #252525;
  color: white;
  font-size: 16px;
}

.panel-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.panel button.action {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

.save-btn { background: white; color: #111; }
.close-btn { background: #353535; color: white; }

@media (max-height: 570px) {
  .side { gap: 5px; padding: 12px 8px; }
  .move-btn { width: 60px; height: 60px; font-size: 27px; }
  .player-name { font-size: 22px; }
  .choices { margin-top: 2px; }
}
</style>
</head>

<body>

<div class="game">
  <section class="side blue-side">
    <div class="round-label" id="roundBlue">ROUND 1 / 3</div>
    <button class="gear" id="gear" aria-label="Settings">⚙</button>

    <div class="player-name">BLUE</div>
    <div class="score">Score: <span id="blueScore">0</span></div>

    <div class="choices">
      <button class="move-btn" data-side="blue" data-move="rock" aria-label="Blue rock"><span>✊</span></button>
      <button class="move-btn" data-side="blue" data-move="paper" aria-label="Blue paper"><span>✋</span></button>
      <button class="move-btn" data-side="blue" data-move="scissors" aria-label="Blue scissors"><span>✌️</span></button>
    </div>

    <div class="status" id="blueStatus">Get ready!</div>
  </section>

  <div class="middle-line"></div>

  <section class="side red-side">
    <div class="round-label" id="roundRed">ROUND 1 / 3</div>

    <div class="player-name">RED</div>
    <div class="score">Score: <span id="redScore">0</span></div>

    <div class="choices">
      <button class="move-btn" data-side="red" data-move="rock" aria-label="Red rock"><span>✊</span></button>
      <button class="move-btn" data-side="red" data-move="paper" aria-label="Red paper"><span>✋</span></button>
      <button class="move-btn" data-side="red" data-move="scissors" aria-label="Red scissors"><span>✌️</span></button>
    </div>

    <div class="status" id="redStatus">Get ready!</div>

    <div class="bottom-controls">
      <button class="small-btn" id="resetBtn">RESTART GAME</button>
    </div>
  </section>
</div>

<div class="countdown" id="countdown">
  <div class="count-number" id="countNumber">READY?</div>
</div>

<div class="result-banner" id="resultBanner"></div>

<div class="overlay" id="settingsOverlay">
  <div class="panel">
    <h2>⚙ Game Settings</h2>
    <p>Choose a secret winner or play fairly. In rigged mode, only the winning color's displayed move changes.</p>

    <label for="winnerMode">Winning mode</label>
    <select id="winnerMode">
      <option value="fair">Fair game</option>
      <option value="blue">Blue always wins</option>
      <option value="red">Red always wins</option>
    </select>

    <label for="roundCount">Number of rounds</label>
    <select id="roundCount">
      <option value="3">3 rounds</option>
      <option value="5">5 rounds</option>
      <option value="1">1 round</option>
    </select>

    <div class="panel-actions">
      <button class="action close-btn" id="closeSettings">Cancel</button>
      <button class="action save-btn" id="saveSettings">Save</button>
    </div>
  </div>
</div>

<script>
const beats = {
  rock: "scissors",
  paper: "rock",
  scissors: "paper"
};

const buttons = [...document.querySelectorAll(".move-btn")];
const countdown = document.getElementById("countdown");
const countNumber = document.getElementById("countNumber");
const resultBanner = document.getElementById("resultBanner");

let picks = { blue: null, red: null };
let score = { blue: 0, red: 0 };
let round = 1;
let totalRounds = 3;
let winnerMode = "fair";
let locked = true;
let gameOver = false;
let timers = [];

function setStatus(side, message) {
  document.getElementById(side + "Status").textContent = message;
}

function updateScore() {
  document.getElementById("blueScore").textContent = score.blue;
  document.getElementById("redScore").textContent = score.red;
}

function updateRoundLabels() {
  const label = `ROUND ${round} / ${totalRounds}`;
  document.getElementById("roundBlue").textContent = label;
  document.getElementById("roundRed").textContent = label;
}

function clearTimers() {
  timers.forEach(clearTimeout);
  timers = [];
}

function hidePicks() {
  buttons.forEach(btn => btn.classList.add("hidden-pick"));
}

function revealPicks() {
  buttons.forEach(btn => btn.classList.remove("hidden-pick"));
}

function clearSelections() {
  buttons.forEach(btn => {
    btn.classList.remove("selected");
    btn.disabled = false;
  });
}

function showMove(side, move) {
  const btn = buttons.find(b =>
    b.dataset.side === side && b.dataset.move === move
  );
  if (btn) btn.classList.add("selected");
}

function beginCountdown() {
  locked = true;
  buttons.forEach(btn => btn.disabled = true);
  hidePicks();
  countdown.classList.add("show");

  const sequence = ["READY?", "3", "2", "1", "GO!"];

  sequence.forEach((value, index) => {
    const timer = setTimeout(() => {
      countNumber.textContent = value;

      if (value === "GO!") {
        const finish = setTimeout(() => {
          countdown.classList.remove("show");
          startPicking();
        }, 450);
        timers.push(finish);
      }
    }, index * 750);

    timers.push(timer);
  });
}

function startPicking() {
  picks = { blue: null, red: null };
  locked = false;
  clearSelections();
  hidePicks();

  setStatus("blue", "PICK NOW!");
  setStatus("red", "PICK NOW!");
}

buttons.forEach(btn => {
  btn.addEventListener("click", () => {
    if (locked || gameOver) return;

    const side = btn.dataset.side;
    const move = btn.dataset.move;

    if (picks[side]) return;

    // Store the choice, but never visually reveal it yet.
    picks[side] = move;
    hidePicks();

    setStatus(side, "LOCKED IN ✓");

    if (picks.blue && picks.red) {
      locked = true;
      buttons.forEach(b => b.disabled = true);
      timers.push(setTimeout(settleRound, 500));
    }
  });
});

function settleRound() {
  let blueMove = picks.blue;
  let redMove = picks.red;

  // Change only the rigged winner's displayed move.
  if (winnerMode === "blue") {
    blueMove = Object.keys(beats).find(move => beats[move] === redMove);
  } else if (winnerMode === "red") {
    redMove = Object.keys(beats).find(move => beats[move] === blueMove);
  }

  picks.blue = blueMove;
  picks.red = redMove;

  revealPicks();
  buttons.forEach(btn => btn.classList.remove("selected"));
  showMove("blue", blueMove);
  showMove("red", redMove);

  let winner = "tie";

  if (blueMove !== redMove) {
    winner = beats[blueMove] === redMove ? "blue" : "red";
  }

  if (winner === "blue") {
    score.blue++;
    setStatus("blue", "ROUND WON!");
    setStatus("red", "ROUND LOST");
    resultBanner.textContent = "🔵 BLUE WINS!";
  } else if (winner === "red") {
    score.red++;
    setStatus("red", "ROUND WON!");
    setStatus("blue", "ROUND LOST");
    resultBanner.textContent = "🔴 RED WINS!";
  } else {
    setStatus("blue", "TIE!");
    setStatus("red", "TIE!");
    resultBanner.textContent = "🤝 IT'S A TIE!";
  }

  updateScore();
  resultBanner.classList.add("show");

  timers.push(setTimeout(() => {
    resultBanner.classList.remove("show");

    if (round >= totalRounds) {
      finishGame();
    } else {
      round++;
      updateRoundLabels();
      beginCountdown();
    }
  }, 1600));
}

function finishGame() {
  gameOver = true;
  locked = true;

  if (score.blue > score.red) {
    resultBanner.textContent = "🏆 BLUE WINS THE GAME!";
  } else if (score.red > score.blue) {
    resultBanner.textContent = "🏆 RED WINS THE GAME!";
  } else {
    resultBanner.textContent = "🤝 THE GAME IS A TIE!";
  }

  resultBanner.classList.add("show");
  setStatus("blue", "GAME OVER");
  setStatus("red", "GAME OVER");
}

function resetGame() {
  clearTimers();

  picks = { blue: null, red: null };
  score = { blue: 0, red: 0 };
  round = 1;
  locked = true;
  gameOver = false;

  updateScore();
  updateRoundLabels();
  clearSelections();
  hidePicks();

  countdown.classList.remove("show");
  resultBanner.classList.remove("show");

  setStatus("blue", "Get ready!");
  setStatus("red", "Get ready!");

  beginCountdown();
}

document.getElementById("resetBtn").addEventListener("click", resetGame);

document.getElementById("gear").addEventListener("click", () => {
  document.getElementById("winnerMode").value = winnerMode;
  document.getElementById("roundCount").value = String(totalRounds);
  document.getElementById("settingsOverlay").classList.add("open");
});

document.getElementById("closeSettings").addEventListener("click", () => {
  document.getElementById("settingsOverlay").classList.remove("open");
});

document.getElementById("saveSettings").addEventListener("click", () => {
  winnerMode = document.getElementById("winnerMode").value;
  totalRounds = Number(document.getElementById("roundCount").value);
  document.getElementById("settingsOverlay").classList.remove("open");
  resetGame();
});

document.getElementById("settingsOverlay").addEventListener("click", event => {
  if (event.target.id === "settingsOverlay") {
    event.currentTarget.classList.remove("open");
  }
});

// Begin automatically with READY? → 3 → 2 → 1 → GO!
hidePicks();
updateRoundLabels();
beginCountdown();
</script>

</body>
</html>
